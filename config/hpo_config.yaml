experiment:
  name: "fraud-detection-hpo-rf"
  tracking_uri: "${MLFLOW_TRACKING_URI}"

tuner:
  strategy: "random_search"
  n_iter: 50
  cv_splits: 5
  scoring: "recall"
  random_state: 42
  n_jobs: -1
  param_dist:
    random_forest:
      n_estimators: [200, 300, 400, 500]
      max_depth: [15, 20, 25, 30, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 5]
      max_features: ["sqrt", "log2"]
      bootstrap: [true]
      max_samples: [0.7, 0.8, 0.9, null]
      class_weight_multiplier: [1, 5, 10, 15, 20]

preprocessing:
  test_size: 0.2
  scaling_features: true
  time_feature_logic: "cyclical"
  
output:
  results_json: "hpo_results.json"
  best_model_save_path: "models/hpo_best_model.pkl"