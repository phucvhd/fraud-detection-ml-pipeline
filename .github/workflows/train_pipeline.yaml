name: ML Training Pipeline

on:
  workflow_dispatch:
    inputs:
      experiment_name:
        description: 'Experiment name (leave empty for auto-generated)'
        required: false
        default: ''

      use_sample_data:
        description: 'Use sample dataset for quick testing'
        type: boolean
        required: false
        default: false

      sample_size:
        description: 'Sample size (if using sample data)'
        required: false
        default: '10000'

      n_estimators:
        description: 'Number of trees in the forest'
        required: false
        default: '300'

      max_depth:
        description: 'Maximum depth of trees (null for unlimited)'
        required: false
        default: '15'

      min_samples_split:
        description: 'Minimum samples required to split internal node'
        required: false
        default: '10'

      min_samples_leaf:
        description: 'Minimum samples required at leaf node'
        required: false
        default: '5'

      max_features:
        description: 'Number of features to consider at each split'
        type: choice
        required: false
        default: 'sqrt'
        options:
          - sqrt
          - log2
          - None

      bootstrap:
        description: 'Whether to use bootstrap sampling'
        type: boolean
        required: false
        default: true

      smote_sampling_strategy:
        description: 'SMOTE sampling strategy (0.0-1.0, target ratio minority/majority)'
        required: false
        default: '0.5'

      smote_k_neighbors:
        description: 'Number of nearest neighbors for SMOTE'
        required: false
        default: '5'

      enable_time_features:
        description: 'Enable time-based feature engineering'
        type: boolean
        required: false
        default: true

      enable_amount_features:
        description: 'Enable amount-based feature engineering'
        type: boolean
        required: false
        default: true

      min_recall:
        description: 'Minimum recall threshold (0.0-1.0)'
        required: false
        default: '0.90'

      min_precision:
        description: 'Minimum precision threshold (0.0-1.0)'
        required: false
        default: '0.85'

      min_pr_auc:
        description: 'Minimum PR-AUC threshold (0.0-1.0)'
        required: false
        default: '0.95'

      skip_quality_gates:
        description: 'Skip quality gates (experimental mode)'
        type: boolean
        required: false
        default: false

      auto_deploy:
        description: 'Auto-deploy to staging if quality gates pass'
        type: boolean
        required: false
        default: false

#  push:
#    branches: [main]
#    paths:
#      - 'src/models/**'
#      - 'config/train_config.yaml'
#
#  schedule:
#    - cron: '0 2 * * *'

env:
  AWS_REGION: us-east-1
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  S3_DATA_BUCKET: ${{ secrets.S3_DATA_BUCKET }}
  S3_MODEL_BUCKET: ${{ secrets.S3_MODEL_BUCKET }}

jobs:
  train-model:
    runs-on: ubuntu-latest

    outputs:
      model_uri: ${{ steps.package.outputs.model_uri }}
      run_id: ${{ steps.train.outputs.run_id }}
      passed_quality_gates: ${{ steps.quality_check.outputs.passed }}
      recall: ${{ steps.evaluate.outputs.recall }}
      precision: ${{ steps.evaluate.outputs.precision }}
      pr_auc: ${{ steps.evaluate.outputs.pr_auc }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install databricks-cli

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download data from S3
      run: |
        echo "Downloading dataset from S3..."
        mkdir -p data
        aws s3 cp s3://${{ env.S3_DATA_BUCKET }}/data/creditcard.csv ./data/creditcard.csv
        echo "Dataset downloaded ($(du -h ./data/creditcard.csv | cut -f1))"

    - name: Configure Databricks authentication
      run: |
        echo "Setting up Databricks credentials..."
        export DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}
        export DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}

    - name: Prepare training configuration
      id: config
      run: |
        echo "Preparing configuration with user inputs..."
        
        cat > config/override_config.yaml << 'EOF'
        experiment:
          name: "${{ github.event.inputs.experiment_name || format('auto-run-{0}', github.run_number) }}"
        
        data:
          sample_size: ${{ github.event.inputs.use_sample_data == 'true' && github.event.inputs.sample_size || 'null' }}
        
        model:
          params:
            n_estimators: ${{ github.event.inputs.n_estimators || '300' }}
            max_depth: ${{ github.event.inputs.max_depth == 'null' && 'null' || github.event.inputs.max_depth || '15' }}
            min_samples_split: ${{ github.event.inputs.min_samples_split || '10' }}
            min_samples_leaf: ${{ github.event.inputs.min_samples_leaf || '5' }}
            max_features: "${{ github.event.inputs.max_features || 'sqrt' }}"
            bootstrap: ${{ github.event.inputs.bootstrap || 'true' }}
        
        features:
          time_features:
            enabled: ${{ github.event.inputs.enable_time_features || 'true' }}
          amount_features:
            enabled: ${{ github.event.inputs.enable_amount_features || 'true' }}
        
        imbalance:
          method: "smote"
          smote:
            sampling_strategy: ${{ github.event.inputs.smote_sampling_strategy || '0.5' }}
            k_neighbors: ${{ github.event.inputs.smote_k_neighbors || '5' }}
        
        quality_gates:
          metrics:
            recall:
              threshold: ${{ github.event.inputs.min_recall || '0.90' }}
            precision:
              threshold: ${{ github.event.inputs.min_precision || '0.85' }}
            pr_auc:
              threshold: ${{ github.event.inputs.min_pr_auc || '0.95' }}
          experimental_mode: ${{ github.event.inputs.skip_quality_gates || 'false' }}
        EOF
        
        echo "Configuration prepared"
        echo "--- Override Config ---"
        cat config/override_config.yaml

    - name: Train model
      id: train
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
      run: |
        echo "Starting Random Forest training with SMOTE..."
        echo "Parameters:"
        echo "  - Model: Random Forest"
        echo "  - Trees: ${{ github.event.inputs.n_estimators || '300' }}"
        echo "  - Max Depth: ${{ github.event.inputs.max_depth || '15' }}"
        echo "  - SMOTE Ratio: ${{ github.event.inputs.smote_sampling_strategy || '0.5' }}"
        
        MLFLOW_URI="databricks"
        
        python src/models/train.py \
          --data-path ./data/creditcard.csv \
          --base-config config/train_config.yaml \
          --override-config config/override_config.yaml \
          --mlflow-tracking-uri $MLFLOW_URI
        
        RUN_ID=$(cat run_id.txt)
        echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        echo "Training completed. MLflow Run ID: $RUN_ID"

    - name: Evaluate model
      id: evaluate
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
      run: |
        echo "Evaluating model performance..."
        
        MLFLOW_URI="databricks"
        
        python src/models/evaluate.py \
          --model-run-id ${{ steps.train.outputs.run_id }} \
          --data-path ./data/creditcard.csv \
          --config config/train_config.yaml \
          --override-config config/override_config.yaml \
          --output metrics.json \
          --mlflow-tracking-uri $MLFLOW_URI
        
        RECALL=$(jq -r '.recall' metrics.json)
        PRECISION=$(jq -r '.precision' metrics.json)
        PR_AUC=$(jq -r '.pr_auc' metrics.json)
        F1=$(jq -r '.f1' metrics.json)
        ROC_AUC=$(jq -r '.roc_auc' metrics.json)
        
        echo "recall=$RECALL" >> $GITHUB_OUTPUT
        echo "precision=$PRECISION" >> $GITHUB_OUTPUT
        echo "pr_auc=$PR_AUC" >> $GITHUB_OUTPUT
        echo "f1=$F1" >> $GITHUB_OUTPUT
        
        echo "Evaluation Results:"
        echo "  - Recall: $RECALL"
        echo "  - Precision: $PRECISION"
        echo "  - F1 Score: $F1"
        echo "  - PR-AUC: $PR_AUC"
        echo "  - ROC-AUC: $ROC_AUC"

    - name: Check quality gates
      id: quality_check
      run: |
        echo "Checking quality gates..."
        
        RECALL=${{ steps.evaluate.outputs.recall }}
        PRECISION=${{ steps.evaluate.outputs.precision }}
        PR_AUC=${{ steps.evaluate.outputs.pr_auc }}
        
        MIN_RECALL=${{ github.event.inputs.min_recall || '0.90' }}
        MIN_PRECISION=${{ github.event.inputs.min_precision || '0.85' }}
        MIN_PR_AUC=${{ github.event.inputs.min_pr_auc || '0.95' }}
        
        SKIP_GATES=${{ github.event.inputs.skip_quality_gates }}
        
        if [ "$SKIP_GATES" == "true" ]; then
          echo "Quality gates skipped (experimental mode)"
          echo "passed=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        PASSED=true
        
        if (( $(echo "$RECALL < $MIN_RECALL" | bc -l) )); then
          echo "FAIL: Recall $RECALL below threshold $MIN_RECALL"
          PASSED=false
        else
          echo "PASS: Recall $RECALL meets threshold $MIN_RECALL"
        fi
        
        if (( $(echo "$PRECISION < $MIN_PRECISION" | bc -l) )); then
          echo "FAIL: Precision $PRECISION below threshold $MIN_PRECISION"
          PASSED=false
        else
          echo "PASS: Precision $PRECISION meets threshold $MIN_PRECISION"
        fi
        
        if (( $(echo "$PR_AUC < $MIN_PR_AUC" | bc -l) )); then
          echo "FAIL: PR-AUC $PR_AUC below threshold $MIN_PR_AUC"
          PASSED=false
        else
          echo "PASS: PR-AUC $PR_AUC meets threshold $MIN_PR_AUC"
        fi
        
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        
        if [ "$PASSED" == "false" ]; then
          echo "Model failed quality gates"
          exit 1
        fi
        
        echo "Model passed all quality gates"

    - name: Package model for SageMaker
      id: package
      if: success()
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
      run: |
        echo "Packaging Random Forest model for SageMaker..."
        
        MLFLOW_URI="databricks"

        python src/deploy/package_model.py \
          --mlflow-run-id ${{ steps.train.outputs.run_id }} \
          --output-file model.tar.gz \
          --mlflow-tracking-uri $MLFLOW_URI
        
        MODEL_URI="s3://${{ env.S3_MODEL_BUCKET }}/models/fraud-rf-smote-${steps.train.outputs.run_id}.tar.gz"
        
        aws s3 cp model.tar.gz "$MODEL_URI"
        
        echo "model_uri=$MODEL_URI" >> $GITHUB_OUTPUT
        echo "Model packaged and uploaded to $MODEL_URI"

#    - name: Register model in MLflow
#      if: success()
#      env:
#        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
#        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
#        DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
#      run: |
#        echo "Registering model in MLflow Model Registry..."
#
#        MLFLOW_URI="databricks"
#
#        python src/utils/mlflow_utils.py register-model \
#          --run-id ${{ steps.train.outputs.run_id }} \
#          --model-name "fraud-detection-rf-smote" \
#          --stage "Staging" \
#          --mlflow-tracking-uri $MLFLOW_URI
#
#        echo "Model registered in MLflow"

    - name: Upload training artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: training-artifacts
        path: |
          metrics.json
          run_id.txt
          config/override_config.yaml

    - name: Create training summary
      if: always()
      run: |
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## Random Forest Training Summary
        
        **Experiment:** ${{ github.event.inputs.experiment_name || format('auto-run-{0}', github.run_number) }}  
        **Run ID:** `${{ steps.train.outputs.run_id }}`  
        **Status:** ${{ job.status }}
        
        ### Model Performance
        | Metric | Value | Threshold | Status |
        |--------|-------|-----------|--------|
        | Recall | ${{ steps.evaluate.outputs.recall }} | ${{ github.event.inputs.min_recall || '0.90' }} | ${{ steps.quality_check.outputs.passed == 'true' && 'PASS' || 'FAIL' }} |
        | Precision | ${{ steps.evaluate.outputs.precision }} | ${{ github.event.inputs.min_precision || '0.85' }} | ${{ steps.quality_check.outputs.passed == 'true' && 'PASS' || 'FAIL' }} |
        | PR-AUC | ${{ steps.evaluate.outputs.pr_auc }} | ${{ github.event.inputs.min_pr_auc || '0.95' }} | ${{ steps.quality_check.outputs.passed == 'true' && 'PASS' || 'FAIL' }} |
        | F1 Score | ${{ steps.evaluate.outputs.f1 }} | - | INFO |
        
        ### Random Forest Configuration
        | Parameter | Value |
        |-----------|-------|
        | Number of Trees | ${{ github.event.inputs.n_estimators || '300' }} |
        | Max Depth | ${{ github.event.inputs.max_depth || '15' }} |
        | Min Samples Split | ${{ github.event.inputs.min_samples_split || '10' }} |
        | Min Samples Leaf | ${{ github.event.inputs.min_samples_leaf || '5' }} |
        | Max Features | ${{ github.event.inputs.max_features || 'sqrt' }} |
        | Bootstrap | ${{ github.event.inputs.bootstrap || 'true' }} |
        
        ### SMOTE Configuration
        | Parameter | Value |
        |-----------|-------|
        | Sampling Strategy | ${{ github.event.inputs.smote_sampling_strategy || '0.5' }} |
        | K Neighbors | ${{ github.event.inputs.smote_k_neighbors || '5' }} |
        
        ### Feature Engineering
        - Time Features: ${{ github.event.inputs.enable_time_features || 'true' }}
        - Amount Features: ${{ github.event.inputs.enable_amount_features || 'true' }}
        
        ### Resources
        - [MLflow Run](${{ env.MLFLOW_TRACKING_URI }}/#/experiments/runs/${{ steps.train.outputs.run_id }})
        - [Model Artifacts](${{ steps.package.outputs.model_uri }})
        EOF

    - name: Trigger deployment
      if: success() && github.event.inputs.auto_deploy == 'true' && steps.quality_check.outputs.passed == 'true'
      uses: peter-evans/repository-dispatch@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        event-type: deploy-model
        client-payload: |
          {
            "model_uri": "${{ steps.package.outputs.model_uri }}",
            "run_id": "${{ steps.train.outputs.run_id }}",
            "recall": "${{ steps.evaluate.outputs.recall }}",
            "precision": "${{ steps.evaluate.outputs.precision }}",
            "pr_auc": "${{ steps.evaluate.outputs.pr_auc }}"
          }