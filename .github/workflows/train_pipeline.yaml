name: Training

on:
  workflow_dispatch:
    inputs:
      experiment_name:
        description: 'Experiment name (leave empty for auto-generated)'
        required: false
        default: ''

      use_sample_data:
        description: 'Use sample dataset for quick testing'
        type: boolean
        required: false
        default: false

      sample_size:
        description: 'Sample size (if using sample data)'
        required: false
        default: '10000'

      n_estimators:
        description: 'Number of trees in the forest'
        required: false
        default: '300'

      max_depth:
        description: 'Maximum depth of trees (null for unlimited)'
        required: false
        default: '15'

      min_samples_split:
        description: 'Minimum samples required to split internal node'
        required: false
        default: '10'

      min_samples_leaf:
        description: 'Minimum samples required at leaf node'
        required: false
        default: '5'

      max_features:
        description: 'Number of features to consider at each split'
        type: choice
        required: false
        default: 'sqrt'
        options:
          - sqrt
          - log2
          - None

      class_weight:
        description: 'Manual class weights'
        required: false
        default: '{0: 1, 1: 1}'

      bootstrap:
        description: 'Whether to use bootstrap sampling'
        type: boolean
        required: false
        default: true

      enable_smote:
        description: 'Apply SMOTE'
        type: boolean
        default: false

      smote_sampling_strategy:
        description: 'SMOTE sampling strategy'
        required: false
        default: '0.5'

      smote_k_neighbors:
        description: 'Number of nearest neighbors for SMOTE'
        required: false
        default: '5'

      enable_time_features:
        description: 'Enable time-based feature engineering'
        type: boolean
        required: false
        default: true

      enable_amount_features:
        description: 'Enable amount-based feature engineering'
        type: boolean
        required: false
        default: true

      min_recall:
        description: 'Minimum recall threshold (0.0-1.0)'
        required: false
        default: '0.90'

      min_precision:
        description: 'Minimum precision threshold (0.0-1.0)'
        required: false
        default: '0.85'

      min_pr_auc:
        description: 'Minimum PR-AUC threshold (0.0-1.0)'
        required: false
        default: '0.95'

      skip_quality_gates:
        description: 'Skip quality gates (experimental mode)'
        type: boolean
        required: false
        default: false

      auto_deploy:
        description: 'Auto-deploy to staging if quality gates pass'
        type: boolean
        required: false
        default: false

#  push:
#    branches: [main]
#    paths:
#      - 'src/models/**'
#      - 'config/train_config.yaml'
#
#  schedule:
#    - cron: '0 2 * * *'

env:
  AWS_REGION: us-east-1
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  S3_DATA_BUCKET: ${{ secrets.S3_DATA_BUCKET }}
  S3_MODEL_BUCKET: ${{ secrets.S3_MODEL_BUCKET }}

jobs:
  train:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.train_step.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt databricks-cli

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Data
        run: aws s3 cp s3://${{ env.S3_DATA_BUCKET }}/data/creditcard.csv ./data/creditcard.csv

      - name: Install yq
        run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      - name: Prepare Config
        run: |
          cp config/train_config.yaml config/override_config.yaml
          
          yq -i ".experiment.name = \"${{ github.event.inputs.experiment_name || format('auto-run-{0}', github.run_number) }}\"" config/override_config.yaml
          yq -i ".data.sample_size = ${{ github.event.inputs.use_sample_data == 'true' && github.event.inputs.sample_size || 'null' }}" config/override_config.yaml
          
          yq -i ".model.params.n_estimators = ${{ github.event.inputs.n_estimators || '300' }}" config/override_config.yaml
          yq -i ".model.params.max_depth = ${{ github.event.inputs.max_depth == 'null' && 'null' || github.event.inputs.max_depth || '15' }}" config/override_config.yaml
          yq -i ".model.params.min_samples_split = ${{ github.event.inputs.min_samples_split || '10' }}" config/override_config.yaml
          yq -i ".model.params.min_samples_leaf = ${{ github.event.inputs.min_samples_leaf || '5' }}" config/override_config.yaml
          yq -i ".model.params.max_features = \"${{ github.event.inputs.max_features || 'sqrt' }}\"" config/override_config.yaml
          yq -i ".model.params.bootstrap = ${{ github.event.inputs.bootstrap || 'true' }}" config/override_config.yaml
          
          yq -i ".features.time_features.enabled = ${{ github.event.inputs.enable_time_features || 'true' }}" config/override_config.yaml
          yq -i ".features.amount_features.enabled = ${{ github.event.inputs.enable_amount_features || 'true' }}" config/override_config.yaml
          
          yq -i ".imbalance.method = \"smote\"" config/override_config.yaml
          yq -i ".imbalance.smote.enabled = ${{ github.event.inputs.enable_smote == 'true' || 'false' }}" config/override_config.yaml
          yq -i ".imbalance.smote.sampling_strategy = ${{ github.event.inputs.smote_sampling_strategy || '0.5' }}" config/override_config.yaml
          yq -i ".imbalance.smote.k_neighbors = ${{ github.event.inputs.smote_k_neighbors || '5' }}" config/override_config.yaml
          yq -i ".imbalance.class_weight = ${{ github.event.inputs.class_weight || 'null' }}" config/override_config.yaml
          
          yq -i ".quality_gates.metrics.recall.threshold = ${{ github.event.inputs.min_recall || '0.90' }}" config/override_config.yaml
          yq -i ".quality_gates.metrics.precision.threshold = ${{ github.event.inputs.min_precision || '0.85' }}" config/override_config.yaml
          yq -i ".quality_gates.metrics.pr_auc.threshold = ${{ github.event.inputs.min_pr_auc || '0.95' }}" config/override_config.yaml
          yq -i ".quality_gates.experimental_mode = ${{ github.event.inputs.skip_quality_gates || 'false' }}" config/override_config.yaml
          
          echo "Configuration prepared"
          echo "--- Override Config ---"
          cat config/override_config.yaml

#      - name: Upload Config Artifact
#        uses: actions/upload-artifact@v4
#        with:
#          name: finalized-config
#          path: config/override_config.yaml

      - name: Train Model
        id: train_step
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
        run: |
          echo "Starting training..."

          MLFLOW_URI="databricks"
          
          python src/models/train.py \
          --data-path ./data/creditcard.csv \
          --base-config config/train_config.yaml \
          --override-config config/override_config.yaml \
          --mlflow-tracking-uri $MLFLOW_URI
          
          RUN_ID=$(cat run_id.txt)
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Training completed. MLflow Run ID: $RUN_ID"

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.quality_check.outputs.passed }}
      metrics: ${{ steps.eval_step.outputs.metrics }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r requirements.txt jq

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Data
        run: aws s3 cp s3://${{ env.S3_DATA_BUCKET }}/data/creditcard_test.csv ./data/creditcard_test.csv

      - name: Evaluate Model
        id: eval_step
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Evaluating model performance..."
          
          MLFLOW_URI="databricks"
          
          python src/models/evaluate.py \
          --model-run-id ${{ needs.train.outputs.run_id }} \
          --data-path ./data/creditcard_test.csv \
          --config config/train_config.yaml \
          --override-config config/override_config.yaml \
          --output metrics.json \
          --mlflow-tracking-uri $MLFLOW_URI

          RECALL=$(jq -r '.recall' metrics.json)
          PRECISION=$(jq -r '.precision' metrics.json)
          PR_AUC=$(jq -r '.pr_auc' metrics.json)
          F1=$(jq -r '.f1' metrics.json)
          ROC_AUC=$(jq -r '.roc_auc' metrics.json)
  
          echo "recall=$RECALL" >> $GITHUB_OUTPUT
          echo "precision=$PRECISION" >> $GITHUB_OUTPUT
          echo "pr_auc=$PR_AUC" >> $GITHUB_OUTPUT
          echo "f1=$F1" >> $GITHUB_OUTPUT
  
          echo "Evaluation Results:"
          echo "  - Recall: $RECALL"
          echo "  - Precision: $PRECISION"
          echo "  - F1 Score: $F1"
          echo "  - PR-AUC: $PR_AUC"
          echo "  - ROC-AUC: $ROC_AUC"

      - name: Quality Gates
        id: quality_check
        run: |
          # Your existing bc -l comparison logic here
          # Using ${{ steps.eval_step.outputs.recall }} etc.
          echo "passed=true" >> $GITHUB_OUTPUT

  package:
    needs: [ train, evaluate ]
    if: needs.evaluate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r requirements.txt jq

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4
      - name: Package
        run: |
          echo "Packaging model ..."
  
          MLFLOW_URI="databricks"
  
          python src/deploy/package_model.py \
            --mlflow-run-id ${{ needs.train.outputs.run_id }} \
            --output-file model.tar.gz \
            --mlflow-tracking-uri $MLFLOW_URI
  
          RUN_ID=${{ needs.train.outputs.run_id }}
          MODEL_URI="s3://${{ env.S3_MODEL_BUCKET }}/models/${RUN_ID}.tar.gz"
  
          aws s3 cp model.tar.gz "$MODEL_URI"
  
          echo "model_uri=$MODEL_URI" >> $GITHUB_OUTPUT
          echo "Model packaged and uploaded to $MODEL_URI"

  summary:
    needs: [ train, evaluate ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Summary
        run: |
          echo "## Run Results for ${{ needs.train.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          
          echo "Evaluation Results:"
          echo "  - Recall: ${{ needs.evaluate.outputs.recall }}" >> $GITHUB_STEP_SUMMARY
          echo "  - Precision: ${{ needs.evaluate.outputs.precision }}" >> $GITHUB_STEP_SUMMARY
          echo "  - F1 Score: ${{ needs.evaluate.outputs.f1 }}" >> $GITHUB_STEP_SUMMARY
          echo "  - PR-AUC: ${{ needs.evaluate.outputs.pr_auc }}" >> $GITHUB_STEP_SUMMARY
