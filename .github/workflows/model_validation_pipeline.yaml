name: Model Validation

on:
  workflow_dispatch:
    inputs:
      mlflow_run_id:
        description: 'MLflow Run ID of the trained model to test'
        required: true
        type: string

      model_name:
        description: 'Descriptive name for this validation (e.g., "Production Model Test")'
        required: false
        default: 'Model Performance Validation'

      test_data_file:
        description: 'Test data filename in S3 data bucket'
        required: false
        default: 'data/creditcard_test.csv'
        type: string

      enable_time_features:
        description: 'Enable time-based features (should match training)?'
        type: boolean
        required: false
        default: true

      enable_amount_features:
        description: 'Enable amount-based features (should match training)?'
        type: boolean
        required: false
        default: true

      expected_min_recall:
        description: 'Expected minimum recall (for reference)'
        required: false
        default: '0.85'

      expected_min_precision:
        description: 'Expected minimum precision (for reference)'
        required: false
        default: '0.80'

      save_predictions:
        description: 'Save predictions to S3?'
        type: boolean
        required: false
        default: false

      notification_email:
        description: 'Email for test results (optional)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  S3_DATA_BUCKET: ${{ secrets.S3_DATA_BUCKET }}
  S3_MODEL_BUCKET: ${{ secrets.S3_MODEL_BUCKET }}

jobs:
  validate-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install databricks-cli

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download test data from S3
      run: |
        echo "Downloading test dataset from S3..."
        mkdir -p data
        
        TEST_FILE="${{ github.event.inputs.test_data_file }}"
        echo "Test file: $TEST_FILE"
        
        aws s3 cp s3://${{ env.S3_DATA_BUCKET }}/$TEST_FILE ./data/test_data.csv
    
    - name: Validate model
      id: test
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        echo "============================================"
        echo "Validating Model Performance"
        echo "============================================"
        echo "Model Run ID: ${{ github.event.inputs.mlflow_run_id }}"
        echo "Validation Name: ${{ github.event.inputs.model_name }}"
        echo "Test Data: ${{ github.event.inputs.test_data_file }}"
        echo "============================================"
        echo ""
        
        python src/models/validate_model.py \
          --model-run-id "${{ github.event.inputs.mlflow_run_id }}" \
          --test-data-path ./data/test_data.csv \
          --enable-time-features ${{ github.event.inputs.enable_time_features }} \
          --enable-amount-features ${{ github.event.inputs.enable_amount_features }} \
          --output test_results.json \
          --mlflow-tracking-uri databricks \
          ${{ github.event.inputs.save_predictions == 'true' && '--save-predictions predictions.csv' || '' }}
        
        RECALL=$(jq -r '.recall' test_results.json)
        PRECISION=$(jq -r '.precision' test_results.json)
        F1=$(jq -r '.f1' test_results.json)
        PR_AUC=$(jq -r '.pr_auc' test_results.json)
        ROC_AUC=$(jq -r '.roc_auc' test_results.json)
        
        echo "recall=$RECALL" >> $GITHUB_OUTPUT
        echo "precision=$PRECISION" >> $GITHUB_OUTPUT
        echo "f1=$F1" >> $GITHUB_OUTPUT
        echo "pr_auc=$PR_AUC" >> $GITHUB_OUTPUT
        echo "roc_auc=$ROC_AUC" >> $GITHUB_OUTPUT
        
        echo ""
        echo "============================================"
        echo "Validation Results Summary"
        echo "============================================"
        echo "Recall:      $RECALL"
        echo "Precision:   $PRECISION"
        echo "F1 Score:    $F1"
        echo "PR-AUC:      $PR_AUC"
        echo "ROC-AUC:     $ROC_AUC"
        echo "============================================"

    - name: Check performance expectations
      id: check_expectations
      run: |
        echo "Checking performance against expectations..."
        
        RECALL=${{ steps.test.outputs.recall }}
        PRECISION=${{ steps.test.outputs.precision }}
        
        EXPECTED_RECALL=${{ github.event.inputs.expected_min_recall }}
        EXPECTED_PRECISION=${{ github.event.inputs.expected_min_precision }}
        
        MEETS_EXPECTATIONS=true
        
        echo ""
        if (( $(echo "$RECALL < $EXPECTED_RECALL" | bc -l) )); then
          echo "WARNING: Recall $RECALL below expected $EXPECTED_RECALL"
          MEETS_EXPECTATIONS=false
        else
          echo "PASS: Recall $RECALL meets expected $EXPECTED_RECALL"
        fi
        
        if (( $(echo "$PRECISION < $EXPECTED_PRECISION" | bc -l) )); then
          echo "WARNING: Precision $PRECISION below expected $EXPECTED_PRECISION"
          MEETS_EXPECTATIONS=false
        else
          echo "PASS: Precision $PRECISION meets expected $EXPECTED_PRECISION"
        fi
        
        echo "meets_expectations=$MEETS_EXPECTATIONS" >> $GITHUB_OUTPUT
        
        if [ "$MEETS_EXPECTATIONS" == "false" ]; then
          echo ""
          echo "NOTE: Model performance below expectations"
          echo "Consider:"
          echo "  - Investigating data distribution differences"
          echo "  - Retraining with updated data"
          echo "  - Adjusting feature engineering"
        fi

    - name: Upload predictions to S3
      if: github.event.inputs.save_predictions == 'true'
      run: |
        echo "Uploading predictions to S3..."
        
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        RUN_ID="${{ github.event.inputs.mlflow_run_id }}"
        
        PREDICTIONS_URI="s3://${{ env.S3_MODEL_BUCKET }}/predictions/${RUN_ID}/predictions-${TIMESTAMP}.csv"
        
        aws s3 cp predictions.csv "$PREDICTIONS_URI"
        
        echo "Predictions uploaded to: $PREDICTIONS_URI"

    - name: Upload validation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: |
          test_results.json
          predictions.csv
          confusion_matrix.png
          pr_curve.png
          roc_curve.png

    - name: Create validation summary
      if: always()
      run: |
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## Model Validation Summary
        
        **Validation Name:** ${{ github.event.inputs.model_name }}  
        **Model Run ID:** \`${{ github.event.inputs.mlflow_run_id }}\`  
        **Test Data:** ${{ github.event.inputs.test_data_file }}  
        **Test Date:** $TIMESTAMP  
        **Status:** ${{ job.status }}
        
        ### Validation Performance
        | Metric | Value | Expected | Status |
        |--------|-------|----------|--------|
        | Recall | ${{ steps.test.outputs.recall }} | ${{ github.event.inputs.expected_min_recall }} | ${{ steps.check_expectations.outputs.meets_expectations == 'true' && 'PASS' || 'WARNING' }} |
        | Precision | ${{ steps.test.outputs.precision }} | ${{ github.event.inputs.expected_min_precision }} | ${{ steps.check_expectations.outputs.meets_expectations == 'true' && 'PASS' || 'WARNING' }} |
        | F1 Score | ${{ steps.test.outputs.f1 }} | - | INFO |
        | PR-AUC | ${{ steps.test.outputs.pr_auc }} | - | INFO |
        | ROC-AUC | ${{ steps.test.outputs.roc_auc }} | - | INFO |
        
        ### Feature Configuration
        - Time Features: ${{ github.event.inputs.enable_time_features }}
        - Amount Features: ${{ github.event.inputs.enable_amount_features }}
        
        ### Test Configuration
        - Test Data: \`${{ github.event.inputs.test_data_file }}\`
        - Predictions Saved: ${{ github.event.inputs.save_predictions }}
        
        ### Artifacts
        - Confusion matrix, PR curve, ROC curve available in artifacts
        - [Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        
        ### Interpretation
        ${{ steps.check_expectations.outputs.meets_expectations == 'true' && 'Model performance meets expectations on independent test data. Ready for deployment consideration.' || 'Model performance below expectations. Investigate data distribution shift or consider retraining before deployment.' }}
        EOF
