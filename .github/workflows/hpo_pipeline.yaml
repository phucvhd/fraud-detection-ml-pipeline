name: ML Hyperparameter Tuning Pipeline

on:
  workflow_dispatch:
    inputs:
      experiment_name:
        description: 'HPO Experiment Name'
        required: false
        default: 'rf-tuning-2026'

      search_strategy:
        description: 'Optimization Strategy'
        type: choice
        required: true
        default: 'random'
        options:
          - random
          - grid

      n_iter:
        description: 'Number of parameter settings sampled (for random search)'
        required: false
        default: '50'

      cv_splits:
        description: 'Number of TimeSeriesSplits'
        required: false
        default: '5'

      max_depth_space:
        description: 'Max Depth range (e.g. 10,15,20,25)'
        default: '[10,15,20,25,30]'

      class_weight_space:
        description: 'Fraud weight multipliers to test (e.g. 1,5,10,20)'
        default: '[1,5,10,15,20]'

      min_samples_split:
        default: '[2,5,10]'

      min_samples_leaf:
        default: '[1,2,5]'

      max_features:
        default: '[sqrt, log2]'

      max_samples:
        default: '[0.7,0.8,0.9,null]'

env:
  AWS_REGION: us-east-1
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  S3_DATA_BUCKET: ${{ secrets.S3_DATA_BUCKET }}

jobs:
  tune-model:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install databricks-cli jq

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download data from S3
      run: aws s3 cp s3://${{ env.S3_DATA_BUCKET }}/data/creditcard.csv ./data/creditcard.csv

    - name: Prepare HPO Configuration
      id: hpo_config
      run: |
        echo "Preparing configuration with user inputs..."
        cat > config/override_config.yaml << 'EOF'
        experiment:
          name: "rf-tuning-2026"
          tracking_uri: "${{ secrets.MLFLOW_TRACKING_URI }}"
        tuner:
          strategy: "random_search"
          n_iter: ${{ github.event.inputs.n_iter || '50' }}
          cv_splits: ${{ github.event.inputs.cv_splits || '5' }}
          scoring: "recall"
          random_state: 42
          n_jobs: -1
          param_dist:
            random_forest:
              max_depth: ${{ github.event.inputs.max_depth_space == 'null' && 'null' || github.event.inputs.max_depth_space || '[10,15,20,25,30]' }}
              class_weight_multiplier: ${{ github.event.inputs.class_weight_space == 'null' && 'null' || github.event.inputs.class_weight_space || '[1,5,10,15,20]' }}
              min_samples_split: ${{ github.event.inputs.min_samples_split == 'null' && 'null' || github.event.inputs.min_samples_split || '[1,5,10,15,20]' }}
              min_samples_leaf: ${{ github.event.inputs.min_samples_leaf == 'null' && 'null' || github.event.inputs.min_samples_leaf || '[ 1, 2, 5 ]' }}
              max_features: ${{ github.event.inputs.max_features == 'null' && 'null' || github.event.inputs.max_features || '[ sqrt, log2 ]' }}
              max_samples: ${{ github.event.inputs.max_samples == 'null' && 'null' || github.event.inputs.max_samples || '[ 0.7, 0.8, 0.9, null ]' }}
        output:
          results_json: "hpo_results.json"
        EOF
        
        echo "Configuration prepared"
        echo "--- Override Config ---"
        cat config/override_config.yaml

    - name: Run Hyperparameter Tuning
      id: run_hpo
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
      run: |
        # Use a dedicated tune.py script that uses parent-child MLflow runs
        
        MLFLOW_URI="databricks"
        
        python src/models/tune.py \
          --data-path ./data/creditcard.csv \
          --base-config config/hpo_config.yaml \
          --override-config config/override_config.yaml \
          --mlflow-tracking-uri $MLFLOW_URI
        
        # Assume the script outputs the best run info to a json
        BEST_RUN_ID=$(jq -r '.best_run_id' hpo_results.json)
        echo "best_run_id=$BEST_RUN_ID" >> $GITHUB_OUTPUT

    - name: Package model
      id: package
      if: success()
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        DATABRICKS_USER: ${{ secrets.DATABRICKS_USER }}
      run: |
        echo "Packaging model ..."
        
        MLFLOW_URI="databricks"

        python src/deploy/package_model.py \
          --mlflow-run-id ${{ steps.run_hpo.outputs.best_run_id }} \
          --output-file model.tar.gz \
          --mlflow-tracking-uri $MLFLOW_URI
        
        MODEL_URI="s3://${{ env.S3_MODEL_BUCKET }}/models/fraud-rf-smote-${steps.run_hpo.outputs.best_run_id}.tar.gz"
        
        aws s3 cp model.tar.gz "$MODEL_URI"
        
        echo "model_uri=$MODEL_URI" >> $GITHUB_OUTPUT
        echo "Model packaged and uploaded to $MODEL_URI"

    - name: Create Tuning Summary
      if: always()
      run: |
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## 🧪 HPO Results Summary
        **Strategy:** ${{ github.event.inputs.search_strategy }}
        **Iterations:** ${{ github.event.inputs.n_iter }}
        **Best MLflow Run:** [View Parent Run](${{ env.MLFLOW_TRACKING_URI }}/#/experiments/runs/${{ steps.run_hpo.outputs.best_run_id }})
        
        Check MLflow for the parallel coordinate plot to see parameter correlations.
        EOF